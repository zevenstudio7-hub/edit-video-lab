<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Glass UI — specimen de referencia</title>
<!--
  SPECIMEN DE REFERENCIA — Motion UX (Soft Glass UI)
  Qué es: una implementación mínima, sin dependencias, de los tokens, componentes y movimientos de
  formatos/motion-ux/. Sirve para que cualquier IA (o persona) vea el resultado esperado y copie la matemática.
  Qué NO es: código de producción ni una receta de Remotion. Para llevarlo a Remotion:
    - cada escena es una FUNCIÓN PURA DEL FRAME (render(frame)), igual que un componente de Remotion;
    - interpolate() y spring() de aquí tienen la misma firma y semántica que las de Remotion → se sustituyen 1:1;
    - lo que aquí es style.set(...) allí es el objeto style del componente.
  Fuentes: Inter Tight (identidad video-zeven) y una serif cursiva para énfasis. Sin conexión caen a Inter / serif del sistema.
  Uso: abrir en el navegador. Controles: escena, play/pausa, frame, superficie, color (hex libre).
  Medidas: lienzo 1080×1920 a 30 fps; valores de partida, sin validar en render de Remotion.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    /* se rellenan desde JS (derive) */
    --ui:#0057FF; --ui-600:#0044cc; --ui-300:#6f9bff; --ui-100:#e8f0ff; --on-ui:#fff;
    --resalte:#F5C518; --alerta:#E1062C; --ink:#17171D; --ink2:#6F7280;
    --glow:rgba(0,87,255,.45); --gradA:#021a4d; --gradB:#0a4bd6; --gradC:#5fb0ff; --soft-bg:#eef0f3;
    --a:0deg; /* ángulo del borde aurora */
    --font:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --serif:"Instrument Serif","Playfair Display",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#0e0f13;color:#eee;font-family:var(--font);display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;overflow:auto}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;max-width:1100px;width:100%}
  .bar button,.bar select,.bar input{font:inherit;background:#1d1f27;color:#eee;border:1px solid #333845;border-radius:8px;padding:6px 10px}
  .bar button.on{background:#2b3a66;border-color:#4a66c8}
  .bar input[type=color]{padding:0;width:34px;height:30px}
  .bar input[type=text]{width:92px}
  .bar input[type=range]{width:260px;padding:0}
  .wrap{position:relative;width:calc(1080px*var(--s,.4));height:calc(1920px*var(--s,.4));flex:none}
  .stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform:scale(var(--s,.4));transform-origin:0 0;overflow:hidden;border-radius:0;background:#fff;font-family:var(--font)}
  .scene{position:absolute;inset:0;display:none;overflow:hidden;color:var(--ink)}
  .scene.on{display:block}
  /* área segura (guía) */
  .safe{position:absolute;left:65px;top:250px;width:950px;height:1250px;border:2px dashed rgba(255,0,80,.55);pointer-events:none;display:none;z-index:99}
  .safe.on{display:block}

  /* ============ SUPERFICIES ============ */
  .soft{background:linear-gradient(180deg,#fff,#f4f5f7);border-radius:48px;
        box-shadow:0 60px 110px -40px rgba(20,30,60,.28),0 4px 14px rgba(20,30,60,.07),inset 0 2px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.04)}
  .soft-in{background:#f3f4f6;border-radius:32px;box-shadow:inset 0 2px 5px rgba(20,30,60,.06),inset 0 -2px 0 #fff}
  .glass{background:rgba(255,255,255,.14);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);
         border:2px solid rgba(255,255,255,.32);border-top-color:rgba(255,255,255,.6);border-radius:44px;
         box-shadow:0 50px 100px -30px rgba(4,20,70,.55),inset 0 2px 0 rgba(255,255,255,.45)}
  .glass-in{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.22);border-radius:28px}
  .dark{background:rgba(255,255,255,.06);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
        border:2px solid rgba(255,255,255,.14);border-top-color:rgba(255,255,255,.28);border-radius:36px;
        box-shadow:0 40px 90px -30px rgba(0,0,0,.8),inset 0 2px 0 rgba(255,255,255,.16)}

  /* ============ PÍLDORAS / BOTONES ============ */
  .pill{display:inline-flex;align-items:center;gap:18px;border-radius:999px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .btn-ui{background:linear-gradient(180deg,var(--ui),var(--ui-600));color:var(--on-ui);padding:0 54px;height:112px;font-size:44px;
          box-shadow:0 24px 40px -14px var(--glow),inset 0 2px 0 rgba(255,255,255,.35)}
  .btn-ghost{background:#fff;color:var(--ink);padding:0 54px;height:112px;font-size:44px;border:2px solid #e6e8ec}
  .btn-glass{background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.4);padding:0 54px;height:112px;font-size:44px;backdrop-filter:blur(20px)}
  /* borde aurora (iridiscente): rim light que gira */
  .aurora{position:relative;background:linear-gradient(180deg,#fff,#f3f5f8);color:#3b3f4a;padding:0 80px;height:150px;font-size:70px;font-weight:600;
          box-shadow:0 40px 70px -26px rgba(30,40,80,.3),inset 0 2px 0 #fff}
  .aurora::before{content:"";position:absolute;inset:-6px;border-radius:inherit;padding:6px;
          background:conic-gradient(from var(--a),var(--ui),#ff5db1,#ffb340,#5fe08a,var(--ui-300),var(--ui));
          -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:blur(.6px)}
  .aurora::after{content:"";position:absolute;inset:-6px;border-radius:inherit;z-index:-1;
          background:conic-gradient(from var(--a),var(--ui),#ff5db1,#ffb340,#5fe08a,var(--ui-300),var(--ui));filter:blur(34px);opacity:.35}
  .blobpill{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#eceef2);color:#8a8f9c;height:150px;padding:0 90px;font-size:68px;font-weight:600;
          box-shadow:0 40px 70px -26px rgba(30,40,80,.28),inset 0 2px 0 #fff}
  .blobpill i{position:absolute;border-radius:50%;filter:blur(30px);opacity:.85}
  .blobpill span{position:relative;z-index:1}
  .glossy{width:230px;height:120px;border-radius:999px;border:6px solid #fff;display:flex;align-items:center;justify-content:center;
          background:radial-gradient(ellipse at 50% 55%,var(--ui-300),var(--ui) 85%);box-shadow:0 0 0 4px var(--ui-100) inset,0 30px 50px -20px var(--glow)}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:62px;height:62px;padding:0 18px;border-radius:999px;background:linear-gradient(180deg,var(--ui-300),var(--ui));color:var(--on-ui);font-size:30px;font-weight:800;box-shadow:0 10px 18px -8px var(--glow),inset 0 2px 0 rgba(255,255,255,.4)}
  .chip{display:inline-flex;align-items:center;gap:10px;height:62px;padding:0 24px;border-radius:999px;background:#f1f3f6;color:#8a8f9c;font-size:28px;font-weight:600}
  .chip.on{background:var(--ui-100);color:var(--ui-600)}
  .icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}

  /* ============ TEXTO ============ */
  .h1{font-weight:800;letter-spacing:-.045em;line-height:.95;color:var(--ink)}
  .kw{color:var(--ui)}
  .tint{background:linear-gradient(90deg,color-mix(in srgb,var(--resalte) 38%,transparent) 0 var(--w,0%),transparent var(--w,0%));border-radius:10px;padding:0 6px;margin:0 -6px}
  .serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .caret{display:inline-block;width:5px;height:1.05em;background:var(--ui);vertical-align:-.15em;margin-left:3px}
  .cursor{position:absolute;width:64px;height:64px;z-index:50;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
  .ripple{position:absolute;border-radius:50%;border:4px solid var(--ui);z-index:49}
  .toggle{width:120px;height:68px;border-radius:999px;background:#dfe2e8;position:relative;box-shadow:inset 0 3px 6px rgba(0,0,0,.12)}
  .toggle::after{content:"";position:absolute;top:6px;left:var(--x,6px);width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
  .toggle.on{background:linear-gradient(90deg,var(--ui-300),var(--ui))}
  .abs{position:absolute}
  .center{display:flex;align-items:center;justify-content:center}
  .row{display:flex;align-items:center}
  .win-dots i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:10px}
</style>
</head>

<script>
/* ============================== MOTOR POR FRAME ============================== */
const FPS=30, W=1080, H=1920, TOTAL=270;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
// cubic-bezier (misma idea que CSS / Easing.bezier de Remotion)
function bezier(x1,y1,x2,y2){
  return t=>{ if(t<=0)return 0; if(t>=1)return 1;
    let lo=0,hi=1,u=t; for(let i=0;i<24;i++){ const x=3*(1-u)*(1-u)*u*x1+3*(1-u)*u*u*x2+u*u*u; if(x<t)lo=u; else hi=u; u=(lo+hi)/2; }
    return 3*(1-u)*(1-u)*u*y1+3*(1-u)*u*u*y2+u*u*u; };
}
const EASE={ outExpo:bezier(.16,1,.3,1), inOut:bezier(.65,0,.35,1), soft:bezier(.4,0,.2,1), out:bezier(.22,1,.36,1), in:bezier(.55,0,1,.45), lin:t=>t };
// interpolate(frame,[f0,f1],[v0,v1],{easing})  — misma firma que Remotion
function interpolate(f,inR,outR,o={}){ const e=o.easing||EASE.lin; const t=clamp((f-inR[0])/(inR[1]-inR[0]),0,1); return outR[0]+(outR[1]-outR[0])*e(t); }
// spring({frame,fps,config:{damping,stiffness,mass}}) — oscilador amortiguado de forma cerrada (Remotion usa simulación; resultado equivalente)
function spring({frame,fps=FPS,config={}}){ const {damping=10,stiffness=100,mass=1}=config; const t=Math.max(frame,0)/fps;
  const w0=Math.sqrt(stiffness/mass), z=damping/(2*Math.sqrt(stiffness*mass));
  if(z<1){ const wd=w0*Math.sqrt(1-z*z); return 1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+(z*w0/wd)*Math.sin(wd*t)); }
  return 1-Math.exp(-w0*t)*(1+w0*t); }
const SPRING={ suave:{damping:200}, pop:{damping:14,stiffness:180,mass:.8}, rebote:{damping:8,stiffness:140}, firme:{damping:20,stiffness:300} };

/* ============================== PALETA (derivación desde el hex del usuario) ============================== */
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return[h,s*100,l*100];}
const hsl=(h,s,l,a=1)=>`hsla(${Math.round((h%360+360)%360)},${Math.round(s)}%,${Math.round(l)}%,${a})`;
function lum([r,g,b]){const f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b);}
function applyPalette(uiHex,resHex){
  const rgb=hex2rgb(uiHex), [H,S,L]=rgb2hsl(rgb), R=document.documentElement.style;
  R.setProperty('--ui',uiHex);
  R.setProperty('--ui-600',hsl(H,S,Math.max(L-12,8)));
  R.setProperty('--ui-300',hsl(H,Math.max(S-8,25),Math.min(L+22,88)));
  R.setProperty('--ui-100',hsl(H,Math.min(S,90),95));
  R.setProperty('--glow',hsl(H,S,L,.45));
  R.setProperty('--gradA',hsl(H,90,Math.min(L,14)));
  R.setProperty('--gradB',hsl(H,85,clamp(L,30,42)));
  R.setProperty('--gradC',hsl(H+20,75,62));
  R.setProperty('--soft-bg',hsl(H,14,95));
  R.setProperty('--on-ui',lum(rgb)>.5?'#17171D':'#FFFFFF');   // contraste automático
  R.setProperty('--resalte',resHex);
}

/* ============================== UTILIDADES DOM ============================== */
const $=s=>document.querySelector(s);
const set=(el,st)=>{for(const k in st)el.style[k]=st[k];};
const pad=(n)=>String(n);

/* ============================== ESCENA A · PROMPT ESCRITO ============================== */
const A_TEXT="Quiero una imagen profesional del tema X, con esta paleta y diseño.";
const A_KEYS=[{k:'tema',from:A_TEXT.indexOf('tema X'),to:A_TEXT.indexOf('tema X')+6},{k:'paleta',from:A_TEXT.indexOf('paleta'),to:A_TEXT.indexOf('paleta')+6},{k:'diseño',from:A_TEXT.indexOf('diseño'),to:A_TEXT.indexOf('diseño')+6}];
// calendario de tecleo: 2 frames/carácter + pausas tras espacio (4) y coma (7); empieza en el frame 34
const A_SCHED=(()=>{const t=[];let f=34;for(let i=0;i<A_TEXT.length;i++){t.push(f);const c=A_TEXT[i];f+=1.7+(c===' '?1.6:0)+(c===','?5:0);}return{t,end:f};})();
function renderA(f){
  // 0–12 titular con desenfoque de entrada
  set($('#aTag'),{opacity:interpolate(f,[2,12],[0,1])});
  const ph=interpolate(f,[0,12],[0,1],{easing:EASE.outExpo});
  set($('#aH'),{opacity:ph,filter:`blur(${(1-ph)*16}px)`,transform:`translateY(${(1-ph)*18}px)`});
  // 8–24 tarjeta sube
  const pc=interpolate(f,[8,26],[0,1],{easing:EASE.outExpo});
  set($('#aCard'),{opacity:Math.min(1,pc*1.6),transform:`translateY(${(1-pc)*110}px) scale(${.95+.05*pc})`});
  // tachado "Créame una foto." 24–34
  $('#aStrike').style.width=interpolate(f,[22,34],[0,300],{easing:EASE.inOut})+'px';
  // texto tecleado
  let n=0;for(let i=0;i<A_SCHED.t.length;i++){if(f>=A_SCHED.t[i])n=i+1;}
  let html='',cursorPos=n;
  for(let i=0;i<n;i++){
    const ch=A_TEXT[i];
    const key=A_KEYS.find(k=>i>=k.from&&i<k.to);
    html+= key? `<span class="tint" style="--w:100%">${ch}</span>` : ch;
  }
  const blink=Math.floor(f/8)%2===0 || n<A_TEXT.length&&f<A_SCHED.end;
  $('#aText').innerHTML=html+(blink?'<span class="caret"></span>':'');
  // chips: se activan cuando su palabra clave está completa, con pop
  A_KEYS.forEach(k=>{
    const done=A_SCHED.t[k.to-1]; const el=document.querySelector(`#aChips [data-k="${k.k}"]`); if(!el)return;
    const on=f>=done+2; el.classList.toggle('on',on);
    const p=on?spring({frame:f-done-2,config:SPRING.pop}):0; el.style.transform=`scale(${on?.86+.14*p:1})`;
    el.innerHTML=(on?ic('check','1em')+' ':'')+el.textContent.trim();
  });
  // cursor: aparece tras terminar de teclear, viaja al botón y hace clic
  const t0=A_SCHED.end+8, clickF=t0+26;
  const cx=interpolate(f,[t0,clickF],[700,930],{easing:EASE.inOut}), cy=interpolate(f,[t0,clickF],[1560,1330],{easing:EASE.inOut});
  const press=f>=clickF&&f<clickF+5?.84:1;
  set($('#aCursor'),{opacity:interpolate(f,[t0-4,t0+2],[0,1]),left:cx+'px',top:cy+'px',transform:`scale(${press})`});
  const rp=interpolate(f,[clickF,clickF+14],[0,1],{easing:EASE.outExpo}), rcx=964, rcy=1362;
  set($('#aRipple'),{left:(rcx-10-70*rp)+'px',top:(rcy-10-70*rp)+'px',width:(20+140*rp)+'px',height:(20+140*rp)+'px',opacity:f>=clickF?(1-rp)*.55:0});
  const sendOn=f>=A_SCHED.end?1:0, clicked=f>=clickF;
  set($('#aSend'),{background:clicked?'var(--ink)':(sendOn?'var(--ui)':'#d9dce2'),transform:`scale(${f>=clickF&&f<clickF+6?.92:1})`});
}

  const e=interpolate(f,[0,12],[0,1],{easing:EASE.outExpo});
  set($('#fH1'),{opacity:e,filter:`blur(${(1-e)*14}px)`,transform:`translateY(${(1-e)*20}px)`});
  const wi=Math.floor(f/14)%F_WORDS.length, wl=f%14; const p=interpolate(wl,[0,4],[0,1],{easing:EASE.outExpo});
  set($('#fCap'),{opacity:p,transform:`translateY(${(1-p)*10}px)`}); $('#fCap').textContent=F_WORDS[wi];
  const kp=spring({frame:(f%120)-20,config:SPRING.pop}); $('#fKey').textContent='$10k MRR'; set($('#fKey'),{opacity:(f%120)>=20?1:0,transform:`scale(${.8+.2*kp})`});
  document.querySelectorAll('#fScat [data-s]').forEach(el=>{const i=+el.dataset.s,s=interpolate(f%150,[10+i*8,28+i*8],[0,1],{easing:EASE.outExpo});set(el,{opacity:s,filter:`blur(${(1-s)*12}px)`,transform:`translateY(${(1-s)*(i===2?60:14)}px)`});});
}

/* ============================== ARRANQUE ============================== */
const R={A:renderA,B:renderB,C:renderC,D:renderD,E:renderE,F:renderF};
let cur='A', frame=0, playing=false, last=0;
function draw(){ $('#sA').classList.toggle('on',cur==='A');['B','C','D','E','F'].forEach(k=>$('#s'+k).classList.toggle('on',cur===k)); R[cur](frame); $('#flabel').textContent=frame+' / '+TOTAL; $('#frame').value=frame; }
function fit(){ const s=Math.min((innerWidth-24)/W,(innerHeight-90)/H); document.documentElement.style.setProperty('--s',Math.max(.15,s)); }
function tick(ts){ if(playing){ if(ts-last>=1000/FPS){ frame=(frame+1)%TOTAL; last=ts; draw(); } requestAnimationFrame(tick);} }
$('#scene').onchange=e=>{cur=e.target.value;frame=0;draw();};
$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'⏸ pausa':'▶ play';if(playing)requestAnimationFrame(tick);};
$('#frame').oninput=e=>{frame=+e.target.value;draw();};
function pal(){ const ui=/^#?[0-9a-f]{6}$/i.test($('#chex').value)?($('#chex').value.startsWith('#')?$('#chex').value:'#'+$('#chex').value):$('#cui').value; applyPalette(ui,$('#cres').value); draw(); }
$('#cui').oninput=e=>{$('#chex').value=e.target.value;pal();}; $('#cres').oninput=pal; $('#chex').onchange=()=>{ if(/^#?[0-9a-f]{6}$/i.test($('#chex').value)){const v=$('#chex').value.startsWith('#')?$('#chex').value:'#'+$('#chex').value;$('#cui').value=v;} pal(); };
$('#safe').onchange=e=>$('#safeBox').classList.toggle('on',e.target.checked);
addEventListener('resize',fit);
buildB();buildC();buildD();buildE();buildF();
// API para capturas automáticas: window.go(escena,frame,uiHex,resalteHex)
window.go=(s,f,ui,res)=>{cur=s;frame=f;$('#scene').value=s;applyPalette(ui||'#0057FF',res||'#F5C518');draw();};
applyPalette('#0057FF','#F5C518'); fit(); draw();
</script>
